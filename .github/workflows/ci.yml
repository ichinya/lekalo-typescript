name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: node scripts/check-sources.mjs
      - run: npm ci --prefix adapters/node-typescript --ignore-scripts --no-audit --no-fund
      - run: node adapters/node-typescript/provision-compiler.mjs
      - run: node adapters/node-typescript/build.mjs --check
      - run: node --test --test-concurrency=1 adapters/node-typescript/test/*.test.mjs
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo test --locked --manifest-path crates/discovery/Cargo.toml
      - run: cargo test --locked --manifest-path crates/expressions/Cargo.toml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/package-contract@727243fd12b0eb52409ddb41d8bbbfa143098191
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe

  expression-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/external-tool.mjs --provision
      - run: node scripts/external-tool.mjs --build-services
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/expression-conformance@1053547d61d6d2a0ae2310a035ab9ab8d672930d
