name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: node scripts/check-sources.mjs
      - run: npm ci --prefix adapters/node-typescript --ignore-scripts --no-audit --no-fund
      - run: node adapters/node-typescript/provision-compiler.mjs
      - run: node adapters/node-typescript/build.mjs --check
      - run: node --test --test-concurrency=1 adapters/node-typescript/test/*.test.mjs
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo test --locked --manifest-path crates/discovery/Cargo.toml
      - run: cargo test --locked --manifest-path crates/expressions/Cargo.toml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ichinya/lekalo/.github/actions/test-official-package@6f5387d98092d73f011003e62c3a59859b7271e8
        with:
          package: lekalo-typescript
